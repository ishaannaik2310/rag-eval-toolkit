[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval"
version = "0.1.0"
description = "Open-Source RAG Evaluation & Observability Toolkit ('Pytest for RAG')"
readme = "PROJECT_1_RAG_EVAL_FULL.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "RAG Eval Contributors" }
]
keywords = ["rag", "evaluation", "llm", "pytest", "ai-safety", "observability", "metrics"]
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[project.scripts]
rag-eval = "rag_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rag_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
